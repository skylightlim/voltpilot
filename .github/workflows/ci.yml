name: CI

# Tests on every push and pull request; deploy only from main, and only after
# the tests that matter have passed. Nothing here depends on a developer's
# machine — that was the point of the path audit that preceded it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to main should supersede an in-flight deploy rather than race
# it. Pull requests cancel freely; a running deploy is allowed to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -q

      # Guards the data the decision engine reads. Errors mean the engine would
      # return a wrong answer; warnings are documented fallbacks and pass.
      - name: Validate seed data
        run: python scripts/validate_data.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      # i18n integrity, the light-theme lock, font bindings. The route checks in
      # this suite skip themselves when no dev server is running, which is the
      # case here — the build below is what proves the pages compile.
      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        # Baked into the /api/proxy rewrite at build time, so it must be set
        # here rather than at runtime. next.config.ts fails the build if it is
        # missing in production rather than shipping a placeholder host.
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: npm run build

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Cloudflare Pages serves the adapter's output, not `next build`'s.
      - name: Build for Cloudflare Pages
        working-directory: frontend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: npx @cloudflare/next-on-pages@1

      - name: Deploy frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy .vercel/output/static --project-name=voltpilot --branch=main

      # The backend is a container behind a Durable Object. The runner has
      # Docker, which is what wrangler needs to build the image; the build
      # context is the repository root because data/, scripts/ and scraper/ all
      # live there (see Dockerfile).
      - name: Deploy backend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy

      # Deploying is not the same as working. The container cold-starts on first
      # request, so retry briefly before calling it a failed release.
      - name: Smoke test the deployment
        if: ${{ vars.BACKEND_URL != '' }}
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${{ vars.BACKEND_URL }}/health" || true)
            echo "attempt $i: /health -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::backend /health never returned 200 after deploy"
          exit 1
