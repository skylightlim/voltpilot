name: CI

# Tests on every push and pull request; deploy only from main, and only after
# the tests that matter have passed. Nothing here depends on a developer's
# machine — that was the point of the path audit that preceded it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to main should supersede an in-flight deploy rather than race
# it. Pull requests cancel freely; a running deploy is allowed to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        # requirements.txt is the runtime set that Vercel bundles; the test
        # stack lives in requirements-dev.txt so it never counts against the
        # function size limit.
        run: pip install -r requirements-dev.txt

      # Proves the migrations actually apply to an empty database. The deploy
      # job runs `alembic upgrade head` against the real database before the new
      # code serves, so a broken revision must fail here rather than there.
      - name: Apply migrations to a fresh database
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_migration_check.db
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -q

      # Guards the data the decision engine reads. Errors mean the engine would
      # return a wrong answer; warnings are documented fallbacks and pass.
      - name: Validate seed data
        run: python scripts/validate_data.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      # i18n integrity, the light-theme lock, font bindings. The route checks in
      # this suite skip themselves when no dev server is running, which is the
      # case here — the build below is what proves the pages compile.
      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        # Baked into the /api/proxy rewrite at build time, so it must be set
        # here rather than at runtime. next.config.ts fails the build if it is
        # missing in production rather than shipping a placeholder host.
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: npm run build

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # The app no longer migrates at startup (RUN_MIGRATIONS=0 on Vercel): a
      # serverless function cold-starts repeatedly and concurrently, so running
      # alembic on the request path is a migration race. Do it once, here,
      # before the new code is serving.
      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

      # Carries any data-file changes from this commit into the live database.
      # No-op when they already agree, so it is safe on every deploy.
      - name: Sync seed data into the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/sync_db.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Two Vercel projects, one repository: the Python API and the Next.js app
      # build differently and scale differently, so they stay separate
      # deployments. The backend goes first — the frontend bakes BACKEND_URL
      # into its /api/proxy rewrite at build time and must not point at a
      # backend that has not shipped yet.
      - name: Deploy backend
        working-directory: backend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
          # The bundle is ~744 MB — scipy (via pymcdm), pandas, numpy and pillow
          # (via reportlab) dominate — against a 500 MB standard limit, so this
          # opts into Large Functions (up to 5 GB on Fluid compute). It is also
          # set on the project itself; setting it here too means a build does not
          # silently fall back to the standard limit if `vercel pull` misses it.
          VERCEL_SUPPORT_LARGE_FUNCTIONS: "1"
        run: |
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          # --archive=tgz because the bundle is ~16,000 files against a 15,000
          # file-count limit on the plain upload path.
          vercel deploy --prebuilt --prod --archive=tgz --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy frontend
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

      # Deploying is not the same as working. The function cold-starts on first
      # request, so retry briefly before calling it a failed release.
      - name: Smoke test the deployment
        if: ${{ vars.BACKEND_URL != '' }}
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${{ vars.BACKEND_URL }}/health" || true)
            echo "attempt $i: /health -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::backend /health never returned 200 after deploy"
          exit 1
