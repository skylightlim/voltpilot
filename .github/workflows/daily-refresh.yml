name: Daily data refresh

# The refresh used to run inside the deployed backend: a Cloudflare cron hit
# POST /admin/refresh, and the container rewrote files under data/. That cannot
# work on Vercel, whose filesystem is read-only apart from /tmp — a function has
# nowhere to put the result and nothing to persist it to.
#
# So the job moves here. The runner has a writable checkout, commits the
# refreshed data files (which is what makes the change reviewable and
# revertable), pushes them into the live database, and then starts CI, which
# redeploys with the new files baked in. The commit alone does not start CI:
# see the last step.

on:
  schedule:
    # 22:00 UTC = 06:00 MYT, before the Malaysian working day.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Refresh a single source (blank = all)"
        required: false
        type: string

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # to start ci.yml, see "Redeploy with the refreshed files"

jobs:
  refresh:
    name: Refresh data and update the database
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Refresh the data files
        run: |
          python scripts/daily_update.py ${{ inputs.only && format('--only {0}', inputs.only) || '' }}

      # A refresh that pulled garbage must not reach the database or the site.
      # validate_data.py exits non-zero only on errors, which are the cases where
      # the engine would return a wrong answer; documented fallbacks warn and pass.
      - name: Validate the refreshed data
        run: python scripts/validate_data.py

      - name: Commit any changes
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # The run record behind /health/data. It is gitignored so that a local
          # run, whose output carries the developer's paths, is never committed by
          # accident; the runner adds it on purpose so it reaches the deploy.
          git add -f data/refresh-state.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes — every source was already current."
            exit 0
          fi
          git commit -m "chore(data): daily refresh $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Runs even when nothing was committed: the database can be behind the
      # files for reasons other than today's refresh (a restore, a manual edit,
      # a failed earlier run), and the sync is a no-op when they already agree.
      - name: Update the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — the database cannot be updated."
            exit 1
          fi
          python scripts/sync_db.py

      # A push made with GITHUB_TOKEN starts no workflow runs, so the commit above
      # never reached CI on its own: the 56 refreshes after 2026-09-15 deployed
      # nothing, and the site kept serving the files of the last human push.
      # workflow_dispatch is GitHub's documented exception to that rule. It runs
      # after the database step so that a failed sync does not ship either.
      - name: Redeploy with the refreshed files
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: Summary
        run: |
          echo "### Daily refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "- data files committed: ${{ steps.commit.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- database sync: see the step above" >> "$GITHUB_STEP_SUMMARY"
          echo "- redeploy started: ${{ steps.commit.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
